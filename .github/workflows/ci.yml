name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -cover ./...

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: cd webapp && npm ci

      - name: Lint
        run: cd webapp && npm run lint

      - name: Type-check and build
        run: cd webapp && npm run build

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The scan needs the newest patch of the release line go.mod declares.
      # setup-go reads the bare `go` directive as an exact version, so
      # go-version-file would pin the toolchain to 1.26.0 and govulncheck
      # would report every standard-library CVE fixed in 1.26.1 and later --
      # findings about the runner's Go, not about this module.
      - name: Resolve the Go release line
        id: goline
        run: sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*/line=\1.x/p' go.mod >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goline.outputs.line }}
          # Without this, a preinstalled Go that satisfies the range is reused
          # and the range never resolves to the latest patch.
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module dependencies
        run: go mod verify

      # Pinned: setup-go sets GOTOOLCHAIN=local, so @latest breaks whenever
      # x/vuln raises its own Go minimum past the release line go.mod
      # declares. Check that minimum before bumping.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...
